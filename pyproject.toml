[project]
name = "lyrelog"
version = "0.9.0"
description = "Structured logs from Python services to Lyrelog, the hosted log service. Standard library only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lyrelog", email = "hello@lyrelog.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["logging", "logs", "structured-logging", "observability", "lyrelog", "fastapi", "django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://lyrelog.com"
Repository = "https://github.com/lyrelog/lyrelog-python"
Documentation = "https://docs.lyrelog.com"
Issues = "https://github.com/lyrelog/lyrelog-python/issues"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
